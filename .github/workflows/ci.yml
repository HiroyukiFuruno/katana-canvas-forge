name: CI

on:
  push:
    branches: [ master, release/*, feature/* ]
  pull_request:
    branches: [ master ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.95.0
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
          rustup default 1.95.0
      - name: Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install NPM dependencies
        run: npm install
      - name: Install Just
        uses: extractions/setup-just@v2
      - name: Lint
        run: just lint
      - name: Test
        run: just test
      - name: Mermaid Comparison Test
        run: just compare 100
